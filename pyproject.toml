[project]
name = "dortrader"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.146.0",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
files = ["apps", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
